<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Script List</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }

        table {
            border-collapse: collapse;
            width: 60%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f5f5f5;
        }

        tr:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <h2>脚本列表</h2>

    <table>
        <tr>
            <th>脚本名</th>
            <th>类型</th>
        </tr>
        {% for s in scripts %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.suffix }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="2">没有找到脚本</td>
        </tr>
        {% endfor %}
    </table>

</body>

</html>
